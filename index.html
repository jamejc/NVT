.arr{width:34px;height:34px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;margin-left:6px}
.cats{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding:4px 2px 8px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 66px;text-align:center;cursor:pointer;font-size:12px;color:var(--mut)}
.cat i{display:flex;width:58px;height:58px;margin:0 auto 6px;border-radius:99px;background:var(--card);border:2px solid var(--bd);align-items:center;justify-content:center;font-style:normal;font-size:28px;box-shadow:0 2px 6px #0001}
.cat.on i{border-color:var(--pri)}.cat.on{color:var(--pri);font-weight:600}
.mos{display:flex;flex-direction:column;gap:8px}.mrow{display:flex;gap:8px;height:140px}
.zt{border-radius:10px;position:relative;overflow:hidden;cursor:pointer;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:10px 6px}
.zt::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 30%,#0008)}
.zt b,.zt small{position:relative;z-index:1;text-shadow:0 1px 3px #0008}.zt b{font-size:17px}.zt small{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.zt:hover{filter:brightness(1.1)}
@media(max-width:600px){.mrow{flex-wrap:wrap;height:auto}.zt{flex:1 1 45%!important;height:100px}}
</style>

const nrm=t=>String(t||'').toLowerCase().replace(/[\u0E48-\u0E4C]/g,'').replace(/[\s\-_.,()'"•/&]+/g,'');
function fdist(q,t){const m=q.length;let p2=null,prev=Array.from({length:m+1},(_,i)=>i),best=m;for(let j=0;j<t.length;j++){const cur=[0];for(let i=1;i<=m;i++){let v=Math.min(prev[i]+1,cur[i-1]+1,prev[i-1]+(q[i-1]===t[j]?0:1));if(p2&&i>1&&q[i-1]===t[j-1]&&q[i-2]===t[j])v=Math.min(v,p2[i-2]+1);cur[i]=v}p2=prev;prev=cur;if(prev[m]<best)best=prev[m]}return best}
function subseq(q,t){let i=0;for(const c of t)if(c===q[i])i++;return i===q.length}
function fscore(q,x){const nq=nrm(q);if(!nq)return 1;const nm=nrm(x.n),ne=nrm(x.e),nz=nrm(x.z),pos=[nm.indexOf(nq),ne.indexOf(nq)].filter(i=>i>=0);
 if(pos.length)return 100-Math.min(...pos)*.5+(nm.startsWith(nq)||ne.startsWith(nq)?10:0);
 if(nz.includes(nq))return 70;
 const toks=String(q).trim().split(/\s+/).map(nrm).filter(Boolean),all=nm+'|'+ne+'|'+nz;
 if(toks.length>1&&toks.every(t=>all.includes(t)))return 80;
 const tk=t=>all.includes(t)||(t.length>=3&&Math.min(fdist(t,nm),ne?fdist(t,ne):9)<=(t.length>=7?2:t.length>=4?1:0));
 if(toks.length>1&&toks.every(tk))return 60;
 if(nq.length>=4){const al=nq.length>=7?2:1,d=Math.min(fdist(nq,nm),ne?fdist(nq,ne):9);if(d<=al)return 40-d}
 if(nq.length>=3&&(subseq(nq,nm)||subseq(nq,ne)))return 20;
 return 0}
function fsearch(q,arr){return arr.map((x,i)=>[fscore(q,x),i,x]).filter(a=>a[0]>0||x_none(a[2])&&!nrm(q)).sort((a,b)=>b[0]-a[0]||a[1]-b[1]).map(a=>a[2])}
const x_none=x=>!!x.none;
function hl(t,q){t=String(t||'');const k=String(q||'').trim().toLowerCase(),i=k?t.toLowerCase().indexOf(k):-1;return i<0?esc(t):esc(t.slice(0,i))+'<span class="hl2">'+esc(t.slice(i,i+k.length))+'</span>'+esc(t.slice(i+k.length))}

let L=DB.lang||'th';
const TH=/[\u0E00-\u0E7F]/;
function tr(t){if(L==='th')return t;const i=L==='en'?1:2;let o=t;for(const r of I18N){if(o.includes(r[0]))o=o.split(r[0]).join(L==='en'?' '+r[i]+' ':r[i])}return o.replace(/\s+/g,' ').trim()}
function trNode(n){if(n.nodeType===3){const raw=n._o!==undefined?n._o:n.nodeValue,k=raw.trim();if(!k)return;const o=(DB.site.ov[L]||{})[k];let nv;const lead=raw.match(/^\s*/)[0],trl=raw.match(/\s*$/)[0];if(o!==undefined)nv=lead+o+trl;else if(L!=='th'&&TH.test(raw))nv=lead+tr(k)+trl;else return;if(nv!==n.nodeValue){if(n._o===undefined)n._o=raw;n.nodeValue=nv}}else if(n.nodeType===1&&n.tagName!=='SCRIPT'&&n.tagName!=='STYLE'){if(L!=='th')['placeholder','title'].forEach(a=>{const v=n.getAttribute(a);if(v&&TH.test(v)){const nv=tr(v);if(nv!==v)n.setAttribute(a,nv)}});n.childNodes.forEach(trNode)}}
new MutationObserver(ms=>{ms.forEach(m=>{m.type==='childList'?m.addedNodes.forEach(trNode):trNode(m.target)})}).observe(document.body,{childList:true,subtree:true,characterData:true});
const FL={th:['🇹🇭','ไทย'],en:['🇬🇧','English'],zh:['🇨🇳','中文']};
function langUI(){$('#navl').innerHTML=`<span class="lang"><button class="btn o s" onclick="event.stopPropagation();$('#lm').classList.toggle('on')">${FL[L][0]} ⌄</button><div class="lm" id="lm">${Object.keys(FL).map(k=>`<div class="lo ${k===L?'on':''}" onclick="setLang('${k}')">${FL[k][0]} ${FL[k][1]}</div>`).join('')}</div></span>`}
function setLang(l){L=l;DB.lang=l;save();document.documentElement.lang=l==='zh'?'zh-CN':l;close_();render()}
document.addEventListener('click',()=>document.querySelectorAll('.lm.on').forEach(m=>m.classList.remove('on')));
document.documentElement.lang=L==='zh'?'zh-CN':L;
const CMSMAP={PJ,AG,TR,RV,VD,ZONES,TYPES,PRJ,ZX};
const DEF={PJ:{n:'โครงการใหม่',z:'',u:0,t:'คอนโด',f:1,p:'0',d:'',i:'🏢'},AG:{n:'เอเจนท์ใหม่',z:'',t:['คอนโด'],q:'',r:'5.0'},TR:['สายใหม่','#0e9fb5','N'],RV:'รีวิวใหม่',VD:'วิดีโอใหม่',ZONES:'ทำเลใหม่',TYPES:'ประเภทใหม่',PRJ:{n:'โครงการใหม่',e:'',z:'',lat:'',lng:''},ZX:{n:'ทำเลใหม่',e:'',lat:'',lng:''}};
function fixDB(){DB.site=Object.assign({name:'New Vista Int. Properties',color:'#0e9fb5',logo:null,phone:'02-000-0000',email:'info@newvista.com',line:'@newvista',addr:'กรุงเทพมหานคร',foot:'© 2026 New Vista Int. Properties. สงวนลิขสิทธิ์'},DB.site||{});DB.site.ov=DB.site.ov||{th:{},en:{},zh:{}};['th','en','zh'].forEach(k=>DB.site.ov[k]=DB.site.ov[k]||{});const TM={'บ้านเดี่ยว':'บ้าน/บ้านเดี่ยว','ทาวน์โฮม':'ทาวน์โฮม/ทาวน์เฮ้าส์','ตึกแถว':'อาคารพาณิชย์'};DB.listings.forEach(l=>{if(TM[l.type])l.type=TM[l.type]});DB.users.forEach(u=>{if(u.canPost===undefined)u.canPost=u.role!=='user'||DB.listings.some(l=>l.owner===u.email)});if(!DB.users.some(u=>u.role==='staff'))DB.users.push({email:'staff@newvista.com',name:'เจ้าหน้าที่',pass:'staff123',role:'staff',fav:[]})}
const esc=x=>String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const DEFLOGO=document.getElementById('lg').src;
function dk(h){const n=parseInt(h.slice(1),16);return '#'+[16,8,0].map(b=>Math.round(((n>>b)&255)*.75).toString(16).padStart(2,'0')).join('')}
function applySite(){const t=DB.site,r=document.documentElement.style;r.setProperty('--pri',t.color);r.setProperty('--pri2',dk(t.color));document.title=t.name;const g=$('#lg');g.src=t.logo||DEFLOGO;g.alt=t.name}
function footer(){const t=DB.site;$('#ft').innerHTML=`<div style="max-width:1100px;margin:auto;padding:18px 14px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between"><div><b>${esc(t.name)}</b><div class="mut">${esc(t.addr||'')}</div></div><div class="mut">${t.phone?'📞 '+esc(t.phone)+'<br>':''}${t.email?'✉️ '+esc(t.email)+'<br>':''}${t.line?'LINE: '+esc(t.line):''}</div></div><div class="mut" style="text-align:center;padding:10px;border-top:1px solid var(--bd)">${esc(t.foot)}</div>`}
let EDIT=false,cT='site',OVL=[];
const isStaff=()=>{const u=me();return u&&(u.role==='admin'||u.role==='staff')};
function edUI(){if(!isStaff())EDIT=false;const b=$('#edb');b.style.display=isStaff()?'block':'none';b.textContent=EDIT?'✅ เสร็จสิ้นการแก้ไข':'✏️ แก้ไขหน้าเว็บ';document.body.classList.toggle('ed',EDIT)}
function toggleEd(){EDIT=!EDIT;edUI();if(EDIT)toast('โหมดแก้ไข: คลิกข้อความบนหน้าเว็บเพื่อแก้ไข')}
document.addEventListener('click',e=>{if(!EDIT)return;const t=e.target;if(t.closest('#edb,#modal,#navl,#toast'))return;e.preventDefault();e.stopPropagation();const ns=[...t.childNodes].filter(n=>n.nodeType===3&&n.nodeValue.trim());if(!ns.length)return;let n=ns[0];try{const c=document.caretRangeFromPoint(e.clientX,e.clientY);if(c&&ns.includes(c.startContainer))n=c.startContainer}catch(x){}
const key=(n._o!==undefined?n._o:n.nodeValue).trim(),v=prompt('แก้ไขข้อความ ['+L+'] (เว้นว่าง = คืนค่าเดิม)',n.nodeValue.trim());if(v===null)return;const ov=DB.site.ov[L];if(v===''||v===key)delete ov[key];else ov[key]=v;save();render()},true);
function cmsH(){const T=[['site','ตั้งค่าเว็บไซต์'],['texts','ข้อความที่แก้ไข'],['pj','โครงการ'],['ag','เอเจนท์'],['tr','รถไฟฟ้า'],['rv','รีวิว'],['vd','วิดีโอ'],['zn','ทำเล'],['ty','ประเภททรัพย์'],['prj','โครงการที่เพิ่มเข้ามา'],['zx','ทำเลที่เพิ่มเข้ามา']];if(me().role==='admin')T.push(['staff','เจ้าหน้าที่']);T.splice(1,0,['msgs','ข้อความจากลูกค้า']);
const h=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${T.map(([k,n])=>`<button class="chip ${cT===k?'g':''}" onclick="cT='${k}';admin()">${n}</button>`).join('')}</div>`;
const M={pj:['PJ',[['n','ชื่อโครงการ'],['z','ทำเล'],['u','ยูนิต'],['t','ประเภท'],['f','ชั้น'],['p','ราคาเริ่มต้น'],['d','ผู้พัฒนา'],['i','ไอคอน']]],ag:['AG',[['n','ชื่อ'],['z','พื้นที่'],['t','ประเภท (คั่นด้วย ,)'],['q','คำพูด'],['r','คะแนน']]],tr:['TR',[[0,'ชื่อสาย'],[1,'สี'],[2,'ตัวอักษร']]],rv:['RV',[[null,'หัวข้อรีวิว']]],vd:['VD',[[null,'หัวข้อวิดีโอ']]],zn:['ZONES',[[null,'ชื่อทำเล']]],ty:['TYPES',[[null,'ชื่อประเภท']]],prj:['PRJ',[['n','ชื่อโครงการ (ไทย)'],['e','ชื่ออังกฤษ'],['z','ทำเล'],['lat','Lat'],['lng','Lng']]],zx:['ZX',[['n','ชื่อทำเล (ไทย)'],['e','ชื่ออังกฤษ'],['lat','Lat'],['lng','Lng']]]};
if(M[cT])return h+arrEd(M[cT][0],M[cT][1]);if(cT==='msgs')return h+msgsH();if(cT==='texts')return h+textsH();if(cT==='staff'&&me().role==='admin')return h+staffH();return h+siteH()}
const kq=f=>f===null?'null':typeof f==='number'?f:`'${f}'`;
function arrEd(nm,fs){const a=CMSMAP[nm];return `<table style="min-width:640px"><tr>${fs.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr>${a.map((x,i)=>`<tr>${fs.map(f=>{const v=f[0]===null?x:Array.isArray(x[f[0]])?x[f[0]].join(','):x[f[0]];return `<td><input value="${esc(v)}" onchange="cset('${nm}',${i},${kq(f[0])},this.value)"></td>`}).join('')}<td><button class="btn r s" onclick="cdel('${nm}',${i})">ลบ</button></td></tr>`).join('')}</table><button class="btn s" style="margin-top:8px" onclick="cadd('${nm}')">+ เพิ่ม</button>`}
function ccommit(nm){(DB.cms=DB.cms||{})[nm]=JSON.parse(JSON.stringify(CMSMAP[nm]));save();toast('บันทึกแล้ว')}
function cset(nm,i,k,v){const a=CMSMAP[nm];if(k===null)a[i]=v;else if(nm==='AG'&&k==='t')a[i].t=v.split(',').map(x=>x.trim()).filter(Boolean);else a[i][k]=v;ccommit(nm)}
function cdel(nm,i){CMSMAP[nm].splice(i,1);ccommit(nm);admin()}
function cadd(nm){CMSMAP[nm].push(JSON.parse(JSON.stringify(DEF[nm])));ccommit(nm);admin()}
function siteH(){const t=DB.site,f=(k,l,full)=>`<div class="${full?'full':''}"><label>${l}</label><input value="${esc(t[k]||'')}" onchange="sset('${k}',this.value)"></div>`;
return `<div class="f">${f('name','ชื่อเว็บไซต์',1)}<div><label>สีหลักของเว็บ</label><input type="color" value="${t.color}" onchange="sset('color',this.value)" style="height:42px;padding:2px"></div><div><label>โลโก้ (อัปโหลดรูป)</label><input type="file" accept="image/*" onchange="upLogo(this)"><button class="btn o s" style="color:var(--pri);margin-top:6px" onclick="sset('logo',null);admin()">ใช้โลโก้เดิม</button></div>${f('phone','โทรศัพท์')}${f('email','อีเมล')}${f('line','LINE')}${f('addr','ที่อยู่',1)}${f('foot','ข้อความท้ายเว็บ',1)}</div><p class="mut">💡 แก้ข้อความอื่นๆ ทุกจุดบนเว็บ: กดปุ่ม "✏️ แก้ไขหน้าเว็บ" มุมซ้ายล่าง แล้วคลิกข้อความที่ต้องการแก้ (แก้แยกตามภาษาที่เลือกอยู่)</p>`}
function sset(k,v){DB.site[k]=v;save();applySite();footer();toast('บันทึกแล้ว')}
function upLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,600/im.width,150/im.height),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);sset('logo',c.toDataURL('image/png'));admin()};im.src=r.result};r.readAsDataURL(f)}
function textsH(){OVL=[];['th','en','zh'].forEach(l=>Object.keys(DB.site.ov[l]).forEach(k=>OVL.push([l,k,DB.site.ov[l][k]])));return `<table><tr><th>ภาษา</th><th>ข้อความเดิม</th><th>ข้อความใหม่</th><th></th></tr>${OVL.map((o,i)=>`<tr><td>${o[0]}</td><td>${esc(o[1])}</td><td>${esc(o[2])}</td><td><button class="btn r s" onclick="delOv(${i})">คืนค่า</button></td></tr>`).join('')||'<tr><td colspan=4 class="empty">ยังไม่มีข้อความที่แก้ไข</td></tr>'}</table>`}
function delOv(i){const o=OVL[i];delete DB.site.ov[o[0]][o[1]];save();admin()}
function staffH(){const st=DB.users.filter(u=>u.role==='staff');return `<div class="f"><div><label>ชื่อ</label><input id="sn"></div><div><label>อีเมล</label><input id="se"></div><div><label>รหัสผ่าน</label><input id="sp" type="password"></div></div><button class="btn s" style="margin:8px 0" onclick="addStaff()">+ เพิ่มเจ้าหน้าที่</button><table><tr><th>ชื่อ</th><th>อีเมล</th><th></th></tr>${st.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td><button class="btn r s" onclick="rmStaff('${x.email}')">ลบ</button></td></tr>`).join('')}</table>`}
function addStaff(){const n=$('#sn').value.trim(),e=$('#se').value.trim().toLowerCase(),p=$('#sp').value;if(!n||!e||!p)return toast('กรอกข้อมูลให้ครบ');if(DB.users.some(u=>u.email===e))return toast('อีเมลนี้ถูกใช้แล้ว');DB.users.push({email:e,name:n,pass:p,role:'staff',fav:[]});save();admin()}
function rmStaff(e){DB.users=DB.users.filter(u=>u.email!==e);save();admin()}
function setRole(e,r){DB.users.find(u=>u.email===e).role=r;save();toast('อัปเดตแล้ว')}
(function(){for(const k in (DB.cms||{})){CMSMAP[k].length=0;CMSMAP[k].push(...DB.cms[k])}})();
applySite();
render();
</script>
